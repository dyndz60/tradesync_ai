name: Flutter APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Clean Setup and Inject Code
      run: |
        # إنشاء مشروع فلاتر نظيف بالكامل مع دعم الأندرويد
        flutter create . --org com.tradesync --project-name tradesync_ai --platforms=android
        
        # إضافة حزمة الخطوط المطلوبة وتحديث الحزم
        flutter pub add google_fonts:^6.1.0
        flutter pub get

    - name: Build APK Release
      run: flutter build apk --release

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: tradesync-ai-apk
        path: build/app/outputs/flutter-apk/app-release.apk
